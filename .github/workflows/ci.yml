name: CI

on:
  pull_request:
  push:
    branches: [main, codex/tina-mcp-foundation]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run mutation
      - run: npm audit --omit=dev
